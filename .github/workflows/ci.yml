name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Usa la versión de pnpm de "packageManager" en package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos (tsc)
        run: pnpm typecheck

      # Las fechas de calendario dependen de la zona horaria: se prueban
      # en una zona UTC-5 (Colombia) y otra UTC+1 (España).
      - name: Tests (America/Bogota)
        run: pnpm test
        env:
          TZ: America/Bogota

      - name: Tests (Europe/Madrid)
        run: pnpm test
        env:
          TZ: Europe/Madrid
